[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-diagnostic-toolkit"
version = "1.3.0"
description = "Python network connectivity and DNS diagnostic utility using the Python standard library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tcp-dns-diag = "net_diag.diagnostics:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
